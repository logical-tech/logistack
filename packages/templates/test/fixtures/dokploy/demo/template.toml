[variables]
main_domain = "${domain}"
secret_key = "${base64:48}"
admin_user = "${username}"

[config]
[[config.domains]]
serviceName = "web"
port = 8_080
host = "${main_domain}"

[config.env]
APP_URL = "https://${main_domain}"
SECRET_KEY = "${secret_key}"
DB_PASSWORD = "${password:24}"
ADMIN_USER = "${admin_user}"

[[config.mounts]]
filePath = "/demo/config.yml"
content = """
url: https://${main_domain}
"""
