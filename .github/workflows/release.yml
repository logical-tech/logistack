name: Release

# Push a tag such as v0.2.0: four multi-arch images on ghcr.io tagged 0.2.0 and latest, then a
# GitHub Release with notes from the conventional commits since the previous tag.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}

env:
  REGISTRY: ghcr.io/logical-tech

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::tag $TAG is not v<semver>"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [[ $version == *-* ]]; then echo prerelease=true; else echo prerelease=false; fi >>"$GITHUB_OUTPUT"

  # One native runner per architecture (no QEMU), each pushing an untagged image by digest.
  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [logistack, logistack-worker, logistack-agent, logistack-caddy]
        platform: [linux/amd64, linux/arm64]
        include:
          - { image: logistack, context: ., file: Dockerfile, target: api }
          - { image: logistack-worker, context: ., file: Dockerfile, target: worker }
          - { image: logistack-agent, context: ., file: install/agent.Dockerfile, target: "" }
          - { image: logistack-caddy, context: docker/caddy, file: docker/caddy/Dockerfile, target: "" }
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LOGISTACK_VERSION=${{ needs.prepare.outputs.version }}
            LOGISTACK_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Joins the two architectures into one index, tagged <version> and, for a final release, latest.
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [logistack, logistack-worker, logistack-agent, logistack-caddy]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
      - name: Create the multi-arch index
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    needs: [prepare, merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Notes and assets
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash .github/release-notes.sh "$TAG" >notes.md
          mkdir dist
          # The attached installer installs this release when run without --version.
          sed "s/^DEFAULT_VERSION=\"\"$/DEFAULT_VERSION=\"$VERSION\"/" install/install.sh >dist/install.sh
          grep -qx "DEFAULT_VERSION=\"$VERSION\"" dist/install.sh
          cp install/stack.yml dist/stack.yml
          cat notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" \
            dist/install.sh dist/stack.yml
      # GitHub has no API to make a container package public; the first release needs a one-time
      # click per package (docs/INSTALL.md, "Publishing a release"). This only reports it.
      - name: Check the images pull without credentials
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for image in logistack logistack-worker logistack-agent logistack-caddy; do
            token=$(curl -sS "https://ghcr.io/token?scope=repository:logical-tech/$image:pull" | jq -r '.token // empty')
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/logical-tech/$image/manifests/$VERSION")
            if [ "$code" = 200 ]; then
              echo "ghcr.io/logical-tech/$image:$VERSION is public"
            else
              echo "::warning::ghcr.io/logical-tech/$image is not public yet (HTTP $code): set its visibility to Public in the package settings"
            fi
          done
