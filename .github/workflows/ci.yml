name: CI

# develop runs nothing and staging only builds betas (release.yml). Release tags are gated by the
# smoke test in release.yml, so their commit, already checked here on main, isn't checked again.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx biome check .
      # Integration suites start Postgres and Redis containers and several expect an active
      # single-node Swarm; opt-in suites (WORKER_IT=1, TEST_DATABASE_URL) stay skipped.
      - run: docker swarm init
      # The same AppArmor profile install.sh writes: Ubuntu 24.04 otherwise kills rootless BuildKit.
      - name: Let rootless BuildKit create user namespaces
        run: |
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            'profile logistack-rootlesskit /usr/bin/rootlesskit flags=(unconfined) {' '  userns,' '}' |
            sudo tee /etc/apparmor.d/logistack-rootlesskit >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/logistack-rootlesskit
      # The drain and rolling-update suites use the dev Redis on 127.0.0.1:6380.
      - run: docker compose -f docker-compose.dev.yml up -d --wait redis
      - run: bun test
      - name: vite build
        working-directory: apps/web
        run: bunx --bun vite build

  scripts:
    name: Shell and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck install/*.sh .github/release-notes.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # Decides whether this push touches what the smoke test exercises: the installer, the images,
  # the agent, migrations, Caddy and the in-app update.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      smoke: ${{ steps.diff.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # `[skip smoke]` in the head commit's message opts out; check and test still run.
          if [[ "$MESSAGE" == *"[skip smoke]"* ]]; then
            echo smoke=false >>"$GITHUB_OUTPUT"
          # A force push leaves no base to diff against: run it.
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo smoke=true >>"$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | grep -qE '^(install/|docker/|Dockerfile|\.dockerignore|bun\.lock|(apps|packages)/[a-z-]+/package\.json|apps/agent/|packages/db/drizzle/|packages/(docker|proxy)/|apps/server/src/(index|config)\.ts|apps/server/src/routes/updates\.ts|apps/worker/src/(index|config|build|instance-update|update-runner)\.ts)'; then
            echo smoke=true >>"$GITHUB_OUTPUT"
          else
            echo smoke=false >>"$GITHUB_OUTPUT"
          fi

  # The whole install in docker:dind, then an in-app update to locally built images. About
  # 10 minutes from a cold cache, so it runs beside check, and only when the push touches it.
  smoke:
    name: Install and update smoke test
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: SMOKE_UPDATE=1 bash install/smoke.sh
