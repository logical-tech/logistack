name: Plugin image

# Builds one example plugin from examples/plugins/<plugin> for amd64 and arm64 on native runners,
# with its manifest as the io.logistack.plugin.manifest label, and pushes
# ghcr.io/logical-tech/logistack-plugin-<plugin>:<manifest version>. Publish it to the index
# afterwards with `logistack-plugin publish`.
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Folder under examples/plugins
        required: true
        default: hello

permissions: {}

env:
  REGISTRY: ghcr.io/logical-tech

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - id: manifest
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          [[ $PLUGIN =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad plugin name"; exit 1; }
          cd "examples/plugins/$PLUGIN"
          bun -e 'const { manifest } = await import(`${process.cwd()}/src/manifest.ts`); await Bun.write("/tmp/manifest.json", JSON.stringify(manifest)); console.log(`version=${manifest.version}`)' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        env:
          PLUGIN: ${{ inputs.plugin }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build --platform "$PLATFORM" \
            -f "examples/plugins/$PLUGIN/Dockerfile" \
            --label "io.logistack.plugin.manifest=$(cat /tmp/manifest.json)" \
            --label "org.opencontainers.image.source=https://github.com/logical-tech/logistack" \
            --output "type=image,name=$REGISTRY/logistack-plugin-$PLUGIN,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/meta.json .
          digest=$(bun -e 'console.log((await Bun.file("/tmp/meta.json").json())["containerimage.digest"])')
          mkdir -p /tmp/digests && touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: /tmp/digests
        run: |
          image=$REGISTRY/logistack-plugin-$PLUGIN
          docker buildx imagetools create -t "$image:$VERSION" $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$VERSION"
