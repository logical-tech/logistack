<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<title>LogiStack</title>
		<script>
			try {
				const t = localStorage.getItem("ls-theme");
				const dark =
					t === "dark" ||
					(t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				const root = document.documentElement;
				root.classList.toggle("dark", dark);
				// A chosen theme: its variables, cached by src/lib/theme.ts.
				const name = localStorage.getItem("ls-theme-name");
				const vars = name && JSON.parse(localStorage.getItem("ls-theme-vars") || "null");
				const map = vars?.[dark ? "dark" : "light"];
				if (map) {
					for (const k in map) root.style.setProperty(`--${k}`, map[k]);
					root.dataset.theme = name;
				}
			} catch {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
