# Merged over stack.yml by install.sh on a server running Dokploy (MIG-5), so the migration wizard
# can read Dokploy: its Postgres over dokploy-network, its compose files and acme.json in
# /etc/dokploy (read-only). The password stays in a Swarm secret: Dokploy's own one, or one
# install.sh made from the dokploy-postgres service env on older Dokploy releases.
version: "3.9"

services:
  logistack-api:
    environment:
      DOKPLOY_POSTGRES_USER: ${LOGISTACK_DOKPLOY_PG_USER:?set LOGISTACK_DOKPLOY_PG_USER}
      DOKPLOY_POSTGRES_DB: ${LOGISTACK_DOKPLOY_PG_DB:?set LOGISTACK_DOKPLOY_PG_DB}
      DOKPLOY_POSTGRES_PASSWORD_FILE: /run/secrets/dokploy_postgres_password
    secrets:
      - source: dokploy-postgres-password
        target: dokploy_postgres_password
    volumes:
      - /etc/dokploy:/etc/dokploy:ro
    networks: [dokploy-network]

networks:
  dokploy-network:
    external: true

secrets:
  dokploy-postgres-password:
    external: true
    name: ${LOGISTACK_DOKPLOY_PG_SECRET:?set LOGISTACK_DOKPLOY_PG_SECRET}
